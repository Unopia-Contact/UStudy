<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 2200 430"
  width="2200"
  height="430"
>
  <style>
    .room {
      fill: #9fe8f4;
      stroke: #c85f6e;
      stroke-width: 4;
      stroke-linejoin: miter;
    }

    .outline {
      fill: none;
      stroke: #c85f6e;
      stroke-width: 4;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    .detail {
      fill: none;
      stroke: #3a4f61;
      stroke-width: 2.2;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    .marker {
      fill: #c85f6e;
    }

    .code {
      font-family: Arial, sans-serif;
      font-size: 20px;
      font-weight: 700;
      fill: #164d69;
      text-anchor: middle;
    }

    .label {
      font-family: Arial, sans-serif;
      font-size: 18px;
      fill: #164d69;
      text-anchor: middle;
    }

    .small {
      font-family: Arial, sans-serif;
      font-size: 15px;
      fill: #164d69;
      text-anchor: middle;
    }
  </style>

