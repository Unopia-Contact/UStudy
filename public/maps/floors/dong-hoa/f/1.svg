    <text x="1257" y="189" class="room-type">PHÒNG HỌC</text>

    <rect x="1205" y="286" width="28" height="8" fill="#f8fafc" />
    <path class="door" d="M1205 290 V272 A18 18 0 0 1 1223 290" />

    <rect x="1290" y="286" width="28" height="8" fill="#f8fafc" />
    <path class="door" d="M1290 290 V272 A18 18 0 0 1 1308 290" />
  </g>

  <!-- ====================================================== -->
  <!-- PHÒNG TRỰC KỸ THUẬT                                   -->
  <!-- ====================================================== -->

  <g id="technical-room">
    <rect
      class="service"
      x="410"
      y="355"
      width="90"
      height="65"
      rx="3"
    />

    <text x="455" y="383" class="small-label">
      <tspan x="455">Phòng trực</tspan>
      <tspan x="455" dy="16">kỹ thuật</tspan>
