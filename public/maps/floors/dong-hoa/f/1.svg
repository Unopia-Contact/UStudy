    <text x="337.5" y="189" class="room-type">PHÒNG HỌC</text>

    <rect x="287" y="286" width="28" height="8" fill="#f8fafc" />
    <path class="door" d="M287 290 V272 A18 18 0 0 1 305 290" />

    <rect x="370" y="286" width="28" height="8" fill="#f8fafc" />
    <path class="door" d="M370 290 V272 A18 18 0 0 1 388 290" />
  </g>

