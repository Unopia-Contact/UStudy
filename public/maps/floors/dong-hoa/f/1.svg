    <rect x="442" y="351" width="24" height="8" fill="#f8fafc" />
    <path
      class="door"
      d="M442 355 V340 A15 15 0 0 1 457 355"
    />
  </g>

  <!-- ====================================================== -->
  <!-- SẢNH / LỐI VÀO CHÍNH                                  -->
  <!-- ====================================================== -->

  <g id="main-entrance">
    <!-- phần sảnh kéo xuống -->
    <path
      d="
        M945 355
        H1035
        V430
        H945
        Z
