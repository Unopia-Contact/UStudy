      <line x1="442" y1="209" x2="500" y2="209" class="stair-line" />
      <line x1="442" y1="220" x2="500" y2="220" class="stair-line" />
      <line x1="442" y1="231" x2="500" y2="231" class="stair-line" />
      <line x1="442" y1="242" x2="500" y2="242" class="stair-line" />
      <line x1="442" y1="253" x2="500" y2="253" class="stair-line" />
      <line x1="442" y1="264" x2="500" y2="264" class="stair-line" />
      <line x1="442" y1="275" x2="500" y2="275" class="stair-line" />

      <path
        d="M471 278 V201 M471 201 L464 211 M471 201 L478 211"
        fill="none"
        stroke="#475569"
        stroke-width="2"
      />
    </g>
  </g>

  <!-- ====================================================== -->
  <!-- F104                                                   -->
  <!-- ====================================================== -->

  <g id="room-f104">
    <rect
      class="room"
      x="512"
      y="70"
      width="205"
      height="220"
      rx="3"
    />

