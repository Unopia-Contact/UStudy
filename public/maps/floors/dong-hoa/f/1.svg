<svg
  viewBox="0 0 1400 520"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Sơ đồ tầng 1 - Nhà F</title>
  <desc id="desc">
    Tầng 1 Nhà F gồm các phòng F101 đến F106, hai cụm WC và cầu thang,
    phòng trực kỹ thuật, hành lang và lối vào chính.
  </desc>

  <defs>
    <style>
      .outer-wall {
        fill: none;
        stroke: #475569;
        stroke-width: 3;
        stroke-linejoin: round;
      }

      .inner-wall {
        fill: none;
        stroke: #64748b;
        stroke-width: 2;
      }

      .room {
        fill: #d9f3ff;
        stroke: #1594c6;
        stroke-width: 2.5;
      }

      .service {
        fill: #e7f7ff;
        stroke: #1594c6;
        stroke-width: 2;
      }

      .corridor {
        fill: #f8fafc;
        stroke: #64748b;
        stroke-width: 2.5;
      }

      .room-code {
        font-family: Inter, Arial, sans-serif;
        font-size: 21px;
        font-weight: 700;
        fill: #075985;
        text-anchor: middle;
      }

      .room-type {
        font-family: Inter, Arial, sans-serif;
        font-size: 12px;
        font-weight: 600;
        fill: #0369a1;
        text-anchor: middle;
      }

      .small-label {
        font-family: Inter, Arial, sans-serif;
        font-size: 12px;
        font-weight: 600;
        fill: #075985;
        text-anchor: middle;
      }

      .corridor-label {
        font-family: Inter, Arial, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 3px;
        fill: #94a3b8;
        text-anchor: middle;
      }

      .door {
        fill: none;
        stroke: #0f6f9f;
        stroke-width: 1.6;
      }

      .stair-line {
        stroke: #64748b;
        stroke-width: 1.4;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="520" fill="#ffffff" />

  <!-- ====================================================== -->
  <!-- HÀNH LANG CHÍNH                                        -->
  <!-- ====================================================== -->

  <path
    class="corridor"
    d="
      M 55 290
      H 1340

      V 355
      H 1035

      V 430
      H 945
      V 355

      H 500
      V 420
      H 410
      V 355

      H 55
      Z
    "
  />

  <text
    x="700"
    y="329"
    class="corridor-label"
  >
    HÀNH LANG
  </text>

  <!-- ====================================================== -->
  <!-- F106                                                   -->
  <!-- ====================================================== -->

  <g id="room-f106">
    <rect
      class="room"
      x="55"
      y="70"
      width="190"
      height="220"
      rx="3"
    />

    <text x="150" y="165" class="room-code">F106</text>
    <text x="150" y="189" class="room-type">PHÒNG HỌC</text>

    <!-- doors -->
    <rect x="112" y="286" width="28" height="8" fill="#f8fafc" />
    <path class="door" d="M112 290 V272 A18 18 0 0 1 130 290" />

    <rect x="190" y="286" width="28" height="8" fill="#f8fafc" />
    <path class="door" d="M190 290 V272 A18 18 0 0 1 208 290" />
  </g>

  <!-- ====================================================== -->
  <!-- F105                                                   -->
  <!-- ====================================================== -->

  <g id="room-f105">
