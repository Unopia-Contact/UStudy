      <line x1="934" y1="209" x2="992" y2="209" class="stair-line" />
      <line x1="934" y1="220" x2="992" y2="220" class="stair-line" />
      <line x1="934" y1="231" x2="992" y2="231" class="stair-line" />
      <line x1="934" y1="242" x2="992" y2="242" class="stair-line" />
      <line x1="934" y1="253" x2="992" y2="253" class="stair-line" />
      <line x1="934" y1="264" x2="992" y2="264" class="stair-line" />
      <line x1="934" y1="275" x2="992" y2="275" class="stair-line" />

      <path
