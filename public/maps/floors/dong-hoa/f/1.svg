      fill="#f8fafc"
      stroke="#64748b"
      stroke-width="2.5"
    />

    <!-- bậc thang ngoài -->
    <line x1="954" y1="437" x2="1026" y2="437" class="inner-wall" />
    <line x1="958" y1="444" x2="1022" y2="444" class="inner-wall" />
    <line x1="962" y1="451" x2="1018" y2="451" class="inner-wall" />
    <line x1="966" y1="458" x2="1014" y2="458" class="inner-wall" />

    <!-- cửa đôi -->
    <rect x="975" y="351" width="30" height="8" fill="#f8fafc" />
    <path
      class="door"
      d="M975 355 V337 A18 18 0 0 1 993 355"
    />
    <path
      class="door"
      d="M1005 355 V337 A18 18 0 0 0 987 355"
    />

    <text
      x="990"
      y="488"
      class="small-label"
      style="font-size:13px;font-weight:700"
    >
      LỐI VÀO CHÍNH
    </text>
  </g>

  <!-- ====================================================== -->
  <!-- ĐƯỜNG BAO NGOÀI NHẸ                                   -->
  <!-- ====================================================== -->

  <path
    class="outer-wall"
    d="
      M55 70
      H1340
      V355
      H1035
      V430
      H945
      V355
      H500
      V420
      H410
      V355
      H55
      Z
    "
    opacity="0.65"
    pointer-events="none"
  />

</svg>