<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 250"
  width="1200"
  height="250"
>
  <style>
    .room {
      fill: #70c9e5;
      fill-opacity: 0.78;
      stroke: #9f5360;
      stroke-width: 3;
      stroke-linejoin: miter;
    }

    .service-area {
      fill: #70c9e5;
      fill-opacity: 0.78;
      stroke: #9f5360;
      stroke-width: 3;
      stroke-linejoin: miter;
    }

    .wall {
      fill: none;
      stroke: #9f5360;
      stroke-width: 3;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    .thin-wall {
      fill: none;
      stroke: #9f5360;
      stroke-width: 2;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    .detail {
      fill: none;
      stroke: #35546a;
      stroke-width: 1.7;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    .room-code {
      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: 500;
      fill: #164966;
      text-anchor: middle;
    }

    .room-name {
      font-family: Arial, sans-serif;
      font-size: 11px;
      fill: #164966;
      text-anchor: middle;
    }

    .small-text {
      font-family: Arial, sans-serif;
      font-size: 9px;
      fill: #164966;
      text-anchor: middle;
    }

    .corridor-marker {
      fill: #9f5360;
    }
  </style>


  <!-- ========================================================= -->
  <!-- KHỐI TRÁI : F106 - F105                                  -->
  <!-- ========================================================= -->

  <!-- F106 -->
  <rect
    id="room-f106"
    class="room"
    x="20"
    y="20"
    width="105"
    height="120"
  />

  <text class="room-code" x="72.5" y="73">F106</text>
  <text class="room-name" x="72.5" y="91">PHÒNG HỌC</text>


  <!-- F105 -->
  <rect
    id="room-f105"
    class="room"
