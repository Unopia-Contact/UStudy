  <style>
    .room {
      fill: #70c9e5;
      fill-opacity: 0.78;
      stroke: #9f5360;
      stroke-width: 3;
      stroke-linejoin: miter;
    }

    .service-area {
      fill: #70c9e5;
      fill-opacity: 0.78;
      stroke: #9f5360;
      stroke-width: 3;
      stroke-linejoin: miter;
    }

    .wall {
      fill: none;
      stroke: #9f5360;
      stroke-width: 3;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    .detail {
      fill: none;
      stroke: #35546a;
      stroke-width: 1.7;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    .room-code {
      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: 500;
      fill: #164966;
      text-anchor: middle;
    }

    .room-name {
      font-family: Arial, sans-serif;
      font-size: 10px;
      fill: #164966;
      text-anchor: middle;
    }

    .small-text {
      font-family: Arial, sans-serif;
      font-size: 8px;
      fill: #164966;
      text-anchor: middle;
    }

    .corridor-marker {
      fill: #9f5360;
    }
  </style>


