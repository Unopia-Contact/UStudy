name: Android signed release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  release-apk:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: android-release
    env:
      USTUDY_RELEASE_BUILD_NUMBER: ${{ github.run_number }}
      USTUDY_RELEASE_BUILD_ATTEMPT: ${{ github.run_attempt }}
      USTUDY_RELEASE_STORE_FILE: ${{ runner.temp }}/ustudy-release.keystore

    steps:
      - name: Check signing configuration
        env:
          USTUDY_RELEASE_KEYSTORE_BASE64: ${{ secrets.USTUDY_RELEASE_KEYSTORE_BASE64 }}
          USTUDY_RELEASE_STORE_PASSWORD: ${{ secrets.USTUDY_RELEASE_STORE_PASSWORD }}
          USTUDY_RELEASE_KEY_ALIAS: ${{ secrets.USTUDY_RELEASE_KEY_ALIAS }}
          USTUDY_RELEASE_KEY_PASSWORD: ${{ secrets.USTUDY_RELEASE_KEY_PASSWORD }}
        run: |
          for variable in USTUDY_RELEASE_KEYSTORE_BASE64 USTUDY_RELEASE_STORE_PASSWORD USTUDY_RELEASE_KEY_ALIAS USTUDY_RELEASE_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "Missing required Android release secret: $variable" >&2
              exit 1
            fi
          done
          printf '%s' "$USTUDY_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$USTUDY_RELEASE_STORE_FILE"
          chmod 600 "$USTUDY_RELEASE_STORE_FILE"
          test -s "$USTUDY_RELEASE_STORE_FILE"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.26.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Exclude previously published APK from app assets
        run: |
          if [ -f public/downloads/UStudy-android.apk ]; then
            mv public/downloads/UStudy-android.apk "$RUNNER_TEMP/UStudy-android-previous.apk"
          fi

      - name: Build web assets
        run: pnpm run build:web

      - name: Sync Capacitor project
        run: pnpm exec cap sync android

      - name: Assemble signed release APK
        working-directory: android
        env:
          USTUDY_RELEASE_STORE_PASSWORD: ${{ secrets.USTUDY_RELEASE_STORE_PASSWORD }}
          USTUDY_RELEASE_KEY_ALIAS: ${{ secrets.USTUDY_RELEASE_KEY_ALIAS }}
          USTUDY_RELEASE_KEY_PASSWORD: ${{ secrets.USTUDY_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          apk=android/app/build/outputs/apk/release/UStudy-release.apk
          signer="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          if [ ! -f "$apk" ] || [ -z "$signer" ]; then
            echo 'Release APK or Android apksigner not found.' >&2
            exit 1
          fi
          "$signer" verify --verbose "$apk"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: ustudy-signed-release-apk
          path: android/app/build/outputs/apk/release/UStudy-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish signed APK to website source
        id: publish
        run: |
          git fetch origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo 'Main has moved since this build started; a newer build must publish instead.'
            exit 0
          fi

          cp android/app/build/outputs/apk/release/UStudy-release.apk public/downloads/UStudy-android.apk
          git add public/downloads/UStudy-android.apk
          if git diff --cached --quiet; then
            echo 'Website APK is already identical; nothing to publish.'
            exit 0
          fi

          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore(android): publish signed APK for ${GITHUB_SHA:0:7}"
          git push origin HEAD:main
          echo 'published=true' >> "$GITHUB_OUTPUT"

      - name: Confirm both websites serve the new APK
        if: steps.publish.outputs.published == 'true'
        run: |
          expected="$(sha256sum android/app/build/outputs/apk/release/UStudy-release.apk | cut -d ' ' -f 1)"
          for attempt in $(seq 1 24); do
            pending=0
            for host in ustudy.hakhoi.io.vn ustudy.unopia.io.vn; do
              downloaded="$RUNNER_TEMP/${host}.apk"
              if curl --fail --location --silent --show-error --max-time 20 \
                  "https://${host}/downloads/UStudy-android.apk" -o "$downloaded" && \
                  [ "$(sha256sum "$downloaded" | cut -d ' ' -f 1)" = "$expected" ]; then
                echo "${host} serves the signed APK."
              else
                echo "${host} has not deployed the signed APK yet (attempt ${attempt}/24)."
                pending=1
              fi
            done
            if [ "$pending" -eq 0 ]; then
              exit 0
            fi
            sleep 15
          done
          echo 'One or both websites did not deploy the signed APK. Check Cloudflare build/deploy settings.' >&2
          exit 1
