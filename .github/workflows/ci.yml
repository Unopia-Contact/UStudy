name: Web and extension build

on:
  pull_request:
  push:
    branches: [main, HK/deploy]

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.26.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web and extension
        run: pnpm run build

      - name: Upload extension package
        uses: actions/upload-artifact@v6
        with:
          name: ustudy-extension
          path: |
            dist-extension/
            public/downloads/ustudy-portal-sync.zip
          retention-days: 14
